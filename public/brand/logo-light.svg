    <path d="M34 16 C36 14, 39 14.5, 41 16.5 C43 18.5, 43.5 21, 42.5 23 C41.5 25, 41 27, 43 29 C45 31, 46 34, 43 37 C40.5 39.5, 37 42, 34 44 C33 41, 33 37, 34.5 33 C35.5 31, 35.8 28.5, 34.5 26.5 C33 24, 33 20, 34 16 Z" fill="#FFFFFF"/>
    
